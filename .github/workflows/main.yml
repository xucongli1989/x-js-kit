name: Publish to npm

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts --registry=https://registry.npmjs.org/